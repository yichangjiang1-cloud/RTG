# Mosquitto MQTT Broker — Docker / Linux 容器配置
# 由 server/docker-compose.yml 挂载到容器内：
#   ./mosquitto/mosquitto.conf -> /mosquitto/config/mosquitto.conf
#
# 注意：Mosquitto 2.x 默认 allow_anonymous=false。
# 必须提供 password_file，并与后端 MQTT_USERNAME/PASSWORD 一致。

listener 1883 0.0.0.0
protocol mqtt

# WebSocket 默认关闭：前端走后端 /ws，中控/后端连 1883 TCP。
# 勿占用 9001（GNSS UDP）。若需浏览器直连 MQTT，可改用 9883：
# listener 9883 0.0.0.0
# protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true
log_type error
log_type warning
log_type notice

# 认证：与 Windows 裸机部署一致，禁止匿名
allow_anonymous false
password_file /mosquitto/config/passwd

max_connections -1
max_queued_messages 1000
max_inflight_messages 20
