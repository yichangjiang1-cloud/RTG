# ============================================================
# Mosquitto 生产配置 —— Windows 服务器部署（RTG 项目）
# 用途：前端/后端/broker 都在这台 Windows 服务器；
#       Linux 中控机作为 MQTT 客户端连接本机 1883。
#
# 数据/日志/密码统一放 D:\mosquitto（避免占用 C 盘；
# 不要放 mosquitto 安装目录或 Program Files，避免权限/升级问题）。
# 首次使用前请手动创建目录：
#   mkdir D:\mosquitto\data
#   mkdir D:\mosquitto\log
# ============================================================

# ---- MQTT 主监听（供中控机 TCP 连接）----
# 0.0.0.0 = 监听所有网卡，中控机才能跨机器连进来（不要用 localhost）
listener 1883 0.0.0.0
protocol mqtt

# ---- WebSocket 监听（可选）----
# 本项目前端是连后端的 WebSocket，再由后端连 broker，
# 前端通常不直接连 MQTT，故默认关闭。若前端需直连 MQTT/WS 再放开。
# 注意：端口用 9883，避免与 GNSS 接收机 UDP 9001 端口号混淆。
# listener 9883 0.0.0.0
# protocol websockets

# ---- 认证：关闭匿名，启用账号密码 ----
# 生成密码文件（管理员 PowerShell，mosquitto 安装目录下执行）：
#   .\mosquitto_passwd.exe -c D:\mosquitto\passwd rtg_user
# 之后再加用户去掉 -c：
#   .\mosquitto_passwd.exe D:\mosquitto\passwd another_user
allow_anonymous false
password_file D:\mosquitto\passwd

# ---- 数据持久化 ----
persistence true
persistence_location D:\mosquitto\data\

# ---- 日志（生产降级，避免 log_type all 疯狂写盘）----
log_dest file D:\mosquitto\log\mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp true

# ---- 连接与性能 ----
max_connections -1
max_queued_messages 1000
max_inflight_messages 20
