backend:
  api_base_url: http://localhost:8000
  host: localhost
  port: 8000
  timeout_s: 10
gnss:
  raw_log:
    dir: logs/gnss_raw
    echo_console: false
    enabled: true
    session_gap_s: 2.0
  receiver_a1:
    host: 0.0.0.0
    port: 9001
    role: gantry_a1
  receiver_a2:
    host: 0.0.0.0
    port: 9002
    role: gantry_a2
  receiver_b:
    host: 0.0.0.0
    port: 9003
    role: trolley
imu:
  host: 0.0.0.0
  port: 9010
  sample_rate_hz: 200
logging:
  backup_count: 5
  file: logs/rtg.log
  level: INFO
  max_bytes: 10485760
mqtt:
  broker_host: localhost
  broker_port: 1883
  keepalive: 60
  password: 123456
  qos_control: 1
  qos_status: 1
  qos_telemetry: 0
  username: rtg_user
plc:
  base_station_mode: yard_origin
  cross_yard_deviation: 1
  cross_yard_flag: 1
  enabled: false
  frame_rate_hz: 10
  host: 127.0.0.1
  port: 5000
  reconnect_interval_s: 3
  yard_in_out: 1
vehicle_id: RTG-001
yard_backup:
  path: config/yard_config.yaml
yard_map:
  path: data/yard_map.json
