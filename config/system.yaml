backend:
  api_base_url: http://localhost:8000
  host: localhost
  port: 8000
  timeout_s: 10
gnss:
  raw_log:
    enabled: true
    dir: logs/gnss_raw
    session_gap_s: 2.0
  receiver_a1:
    host: 0.0.0.0
    port: 9001
    role: gantry_a1
  receiver_a2:
    host: 0.0.0.0
    port: 9002
    role: gantry_a2
  receiver_b:
    host: 0.0.0.0
    port: 9003
    role: trolley
imu:
  host: 0.0.0.0
  port: 9010
  sample_rate_hz: 200
logging:
  backup_count: 5
  file: logs/rtg.log
  level: INFO
  max_bytes: 10485760
mqtt:
  broker_host: localhost
  broker_port: 1883
  keepalive: 60
  password: null
  qos_control: 1
  qos_status: 1
  qos_telemetry: 0
  username: null
plc:
  # 联调 / GNSS 模拟时设为 false，避免无 PLC 时反复断连刷 ERROR
  enabled: false
  frame_rate_hz: 10
  host: 192.168.1.200
  port: 5000
  reconnect_interval_s: 3
vehicle_id: RTG-001
yard_backup:
  path: config/yard_config.yaml
yard_map:
  path: data/yard_map.json
