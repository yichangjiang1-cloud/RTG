backend:
  api_base_url: http://localhost:8000
  host: localhost
  port: 8000
  timeout_s: 10
gnss:
  raw_log:
    dir: logs/gnss_raw
    echo_console: false
    enabled: true
    session_gap_s: 2.0
  # 大车 EVK：中控 TCP 客户端连接板卡服务端（可被车辆配置热更新覆盖）
  receiver_a1:
    transport: tcp
    host: 192.168.0.101
    port: 30001
    role: gantry_a1
    reconnect_interval_s: 3
  receiver_a2:
    transport: tcp
    host: 192.168.0.102
    port: 30001
    role: gantry_a2
    reconnect_interval_s: 3
  # 小车：仍为 UDP 监听（双 GGA 设备主动推送）
  receiver_b:
    transport: udp
    host: 0.0.0.0
    port: 9003
    role: trolley
# 全局一份 NTRIP，RTCM 同口转发给两台大车 EVK
ntrip:
  enabled: false
  caster_host: ""
  caster_port: 2101
  mountpoint: ""
  username: ""
  password: ""
  gga_interval_s: 10
  reconnect_interval_s: 5
imu:
  host: 0.0.0.0
  port: 9010
  sample_rate_hz: 200
logging:
  backup_count: 5
  file: logs/rtg.log
  level: INFO
  max_bytes: 10485760
mqtt:
  broker_host: 127.0.0.1
  broker_port: 1883
  keepalive: 60
  password: "123456"
  qos_control: 1
  qos_status: 1
  qos_telemetry: 0
  username: rtg_user
plc:
  base_station_mode: yard_origin
  cross_yard_deviation: 1
  cross_yard_flag: 1
  enabled: true
  frame_rate_hz: 10
  host: 127.0.0.1
  port: 5000
  reconnect_interval_s: 3
  yard_in_out: 1
vehicle_id: RTG-001
yard_backup:
  path: config/yard_config.yaml
yard_map:
  path: data/yard_map.json
